name: Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "oq-*/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and run the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t oqthara/oq:ci .
      - name: Version
        run: docker run --rm oqthara/oq:ci --version | grep -q "oq "
      - name: Run hello world from the image
        run: |
          docker run --rm -v "$PWD/examples:/work" oqthara/oq:ci hello.oq | grep -q "Hello, World!"
      - name: Run the test suite from the image
        run: |
          docker run --rm -v "$PWD/examples:/work" oqthara/oq:ci test tests | grep -q "passed"
