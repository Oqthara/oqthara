name: Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "oq-*/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "examples/**"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "oq-*/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and run the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t oqthara/oq:ci .
      - name: The image runs as a non-root user
        # TH-46. Without a USER directive the container runs as root and a program
        # can replace /app/oq.jar, so the next `oq` invocation runs the replaced jar.
        # Asserting the uid here means deleting the directive fails the workflow
        # rather than relying on someone noticing a diff.
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id oqthara/oq:ci -u)
          echo "container uid: $uid"
          test "$uid" != "0"
      - name: The runner cannot replace the jar it runs
        # The point of the non-root user is that this write fails. Asserting the
        # failure, not the uid, is what ties the mitigation to the threat.
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint sh oqthara/oq:ci -c 'echo x >> /app/oq.jar'; then
            echo "::error::/app/oq.jar is writable by the container user; TH-46 is open"
            exit 1
          fi
          echo "/app/oq.jar is not writable, as intended"
      - name: Version
        run: |
          set -euo pipefail
          docker run --rm oqthara/oq:ci --version | tee /tmp/oq-version.txt
          grep -q "^oq " /tmp/oq-version.txt
      - name: Run hello world from the image
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/examples:/work" oqthara/oq:ci hello.oq | tee /tmp/oq-hello.txt
          grep -q "Hello, World!" /tmp/oq-hello.txt
      - name: Run the test suite from the image
        run: |
          set -euo pipefail
          output=$(docker run --rm -v "$PWD/examples:/work" oqthara/oq:ci test tests)
          echo "$output"
          grep -q ", 0 failed," <<<"$output"
