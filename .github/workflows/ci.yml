name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on CircleCI (.circleci/config.yml) by project decision.
        os: [ubuntu-latest, windows-latest]
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.java }}
          path: |
            */build/reports/tests/test
            */build/reports/jacoco/test/html
            build/reports/jacoco/jacocoAggregate
          retention-days: 7

  package:
    name: Standalone jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build jar
        run: ./gradlew :oq-cli:standaloneJar --no-daemon --console=plain
      - name: Smoke test
        run: java -jar oq-cli/build/libs/oq.jar examples/hello.oq | grep -q "Hello, World!"
      - uses: actions/upload-artifact@v4
        with:
          name: oq-jar
          path: oq-cli/build/libs/oq.jar
