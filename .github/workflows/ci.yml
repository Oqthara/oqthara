name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on CircleCI (.circleci/config.yml) by project decision.
        os: [ubuntu-latest, windows-latest]
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain
      - name: Regenerate documentation and check it is current
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: |
          java -jar oq-cli/build/libs/oq.jar doc .
          git diff --exit-code docs/stdlib/reference.md
      - name: Check documentation matches the implementation
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: |
          python3 scripts/check-links.py
          python3 scripts/check-docs-sync.py
      - name: Unit-test the verification scripts themselves
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 scripts/test_watchdog.py
      - name: Independent backend conformance (interpreter vs compiled jar)
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: |
          ./gradlew :oq-cli:standaloneJar --no-daemon --console=plain
          python3 scripts/verify-conformance.py
      - name: Upload test reports
        # Every matrix leg produces the same report tree, so the four uploads differ only in
        # which JVM generated them. Keep this uploading after ordinary test failures (that is
        # when the reports matter most) but not after a cancelled run, where there is nothing
        # worth keeping. The per-module JaCoCo trees are omitted because jacocoAggregate
        # contains every one of their 449 files; uploading both duplicates 5.1 MB per leg.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}-${{ matrix.java }}
          path: |
            */build/reports/tests/test
            build/reports/jacoco/jacocoAggregate
          compression-level: 1
          retention-days: 7

  classfile:
    name: Bytecode backend (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build --no-daemon --console=plain
      - name: Confirm the classfile backend is selected
        run: |
          ./gradlew :oq-cli:standaloneJar --no-daemon --console=plain
          output=$(java -jar oq-cli/build/libs/oq.jar build examples/hello.oq)
          echo "$output"
          echo "$output" | grep -q "backend=classfile"

  package:
    name: Standalone jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build jar
        run: ./gradlew :oq-cli:standaloneJar --no-daemon --console=plain
      - name: Smoke test
        run: java -jar oq-cli/build/libs/oq.jar examples/hello.oq | grep -q "Hello, World!"
      - uses: actions/upload-artifact@v7
        with:
          name: oq-jar
          path: oq-cli/build/libs/oq.jar

  installers:
    name: ${{ matrix.os }} / installer tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Installer test scripts are owned by another workstream; they may not
        # exist on every branch, and a missing script must fail, never skip.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Run installer tests (ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if [ ! -f scripts/tests/run-installer-tests.sh ]; then
            echo "error: scripts/tests/run-installer-tests.sh is missing on this branch" >&2
            exit 1
          fi
          bash scripts/tests/run-installer-tests.sh
      - name: Run installer tests (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "scripts/tests/installer.tests.ps1"
          if (-not (Test-Path $path)) {
            Write-Error "error: $path is missing on this branch"
            exit 1
          }
          pwsh -NoProfile -File $path
