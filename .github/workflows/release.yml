name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build :oq-cli:standaloneJar --no-daemon --console=plain
      - name: Verify the release version matches the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          code=$(grep -oE 'VERSION = "[^"]+"' oq-cli/src/main/java/dev/oqthara/cli/Main.java | head -1 | cut -d'"' -f2)
          echo "tag=$tag code=$code"
          test "$tag" = "$code"
      - name: Verify documentation matches this release
        run: |
          set -euo pipefail
          java -jar oq-cli/build/libs/oq.jar doc .
          git diff --exit-code docs/stdlib/reference.md
          python3 scripts/check-links.py
          python3 scripts/check-docs-sync.py
      - name: Verify the changelog describes this release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -q "$version" CHANGELOG.md
          echo "changelog mentions $version"
      - name: Checksums
        run: |
          cd oq-cli/build/libs
          sha256sum oq.jar > oq.jar.sha256
          cat oq.jar.sha256
      - name: Verify artifact on a clean runner path
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          cp "$GITHUB_WORKSPACE/oq-cli/build/libs/oq.jar" .
          printf 'print "Hello from a released Oqthara!"\n' > hello.oq
          java -jar oq.jar hello.oq | grep -q "Hello from a released Oqthara!"
      # macOS (JDK 21/25) and Jazzer fuzzing run on CircleCI, not GitHub
      # (.circleci/config.yml, docs/adr/0002-ci-split.md). Block publishing
      # unless those workflows are green for this commit.
      #
      # Optional secret: CIRCLECI_TOKEN (CircleCI personal API token). Without
      # it this step prints a warning and skips the check, so forks and the
      # period before CircleCI is enabled can still release. Add the secret to
      # enforce the gate. The token is only sent to circleci.com and is
      # never printed. The commit is matched on any branch, because a tag
      # pipeline and the main-branch pipeline can both carry the same SHA.
      - name: Verify CircleCI macOS and fuzzing checks
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/check-circleci.py \
            --sha "$GITHUB_SHA" \
            --timeout-minutes 20 \
            --interval-seconds 30
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            oq-cli/build/libs/oq.jar
            oq-cli/build/libs/oq.jar.sha256
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
