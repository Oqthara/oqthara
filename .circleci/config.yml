version: 2.1

# macOS coverage lives here; Linux, Windows, packaging, CodeQL, Pages and releases
# stay on GitHub Actions (.github/workflows).
#
# One-time setup (requires a human with CircleCI access):
#   1. https://app.circleci.com/settings/project/github/Oqthara/oqthara/setup
#   2. "Set Up Project" using the existing .circleci/config.yml, branch main.
#   3. (Optional) add a CIRCLECI_TOKEN secret so the GitHub workflow can poll status.

orbs:
  macos: circleci/macos@2.5.1

executors:
  macos-arm:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
  linux-jdk21:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium

commands:
  gradle_cache:
    steps:
      - restore_cache:
          keys:
            - gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle.kts" }}
            - gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      - save_cache:
          key: gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

jobs:
  test-macos:
    parameters:
      java-version:
        type: string
    executor: macos-arm
    steps:
      - checkout
      - run:
          name: Select JDK << parameters.java-version >>
          command: |
            set -euo pipefail
            echo "machine: $(uname -s) $(uname -m)"

            # CircleCI's macOS images already ship several Temurin JDKs under
            # /Library/Java/JavaVirtualMachines. Prefer those; only install when missing.
            candidate=$(/usr/libexec/java_home -V 2>&1 | grep -oE "/Library/Java/JavaVirtualMachines/[^/]*<< parameters.java-version >>[^/]*\.jdk/Contents/Home" | head -1 || true)
            if [ -z "$candidate" ]; then
              candidate=$(/usr/libexec/java_home -V 2>&1 | grep -E "temurin-<< parameters.java-version >>|jdk-<< parameters.java-version >>" | grep -oE "/[^ ]*\.jdk/Contents/Home" | head -1 || true)
            fi
            if [ -z "$candidate" ] || [ ! -x "$candidate/bin/java" ]; then
              echo "JDK << parameters.java-version >> not found; installing from Adoptium"
              # Homebrew's "temurin" cask lags (it shipped 24 while Adoptium released 25),
              # so pin the exact JDK from Adoptium's API instead of trusting the cask.
              ARCH=$(uname -m)
              case "$ARCH" in
                arm64) AARCH=aarch64 ;;
                *) AARCH=x64 ;;
              esac
              URL="https://api.adoptium.net/v3/binary/latest/<< parameters.java-version >>/ga/mac/${AARCH}/jdk/hotspot/normal/eclipse"
              echo "downloading $URL"
              curl -fsSL "$URL" -o /tmp/jdk.tar.gz
              mkdir -p "$HOME/jdks"
              rm -rf "$HOME/jdks"/*
              tar -xzf /tmp/jdk.tar.gz -C "$HOME/jdks"
              # Adoptium macOS tarballs unpack to jdk-<version>/Contents/Home/bin/java,
              # so the search must be deep enough to reach Contents/Home.
              candidate=$(find "$HOME/jdks" -maxdepth 6 -type f -path "*/Contents/Home/bin/java" 2>/dev/null | head -1 | sed 's|/bin/java$||')
              if [ -z "$candidate" ]; then
                candidate=$(find "$HOME/jdks" -maxdepth 6 -type f -path "*/bin/java" 2>/dev/null | head -1 | sed 's|/bin/java$||')
              fi
              if [ -z "$candidate" ]; then
                echo "error: extracted the archive but found no JDK; contents:" >&2
                find "$HOME/jdks" -maxdepth 4 2>/dev/null | head -20 >&2
                exit 1
              fi
            fi
            if [ -z "${candidate:-}" ] || [ ! -x "${candidate:-}/bin/java" ]; then
              candidate=$(/usr/libexec/java_home -v << parameters.java-version >> 2>/dev/null || true)
            fi
            if [ -z "$candidate" ] || [ ! -x "$candidate/bin/java" ]; then
              echo "error: could not locate a JDK << parameters.java-version >> on this image" >&2
              /usr/libexec/java_home -V 2>&1 >&2 || true
              exit 1
            fi
            # Never accept a near-miss JDK: java_home -v 25 happily returns a 24 install.
            actual=$("$candidate/bin/java" -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/ {print $2}' | tr -d ' ')
            if [ "$actual" != "<< parameters.java-version >>" ]; then
              echo "error: required JDK << parameters.java-version >> but $candidate reports $actual" >&2
              /usr/libexec/java_home -V 2>&1 >&2 || true
              exit 1
            fi
            echo "export JAVA_HOME=$candidate" >> "$BASH_ENV"
            echo "export PATH=$candidate/bin:\$PATH" >> "$BASH_ENV"
            echo "using $candidate (java $actual)"
            "$candidate/bin/java" -version
      - run:
          name: Assert this is really macOS
          command: |
            set -euo pipefail
            test "$(uname -s)" = "Darwin" || { echo "not macOS: $(uname -s)" >&2; exit 1; }
            echo "confirmed $(sw_vers -productName) $(sw_vers -productVersion) on $(uname -m)"
      - restore_cache:
          keys:
            - gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle.kts" }}
            - gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      - run:
          name: Build and test
          command: ./gradlew build --no-daemon --console=plain
      - run:
          name: Smoke test the CLI
          command: |
            set -euo pipefail
            ./gradlew :oq-cli:standaloneJar --no-daemon --console=plain
            java -jar oq-cli/build/libs/oq.jar examples/hello.oq | grep -q "Hello, World!"
            java -jar oq-cli/build/libs/oq.jar --version
      - save_cache:
          key: gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_test_results:
          path: oq-core/build/test-results/test
      - store_test_results:
          path: oq-cli/build/test-results/test
      - store_test_results:
          path: oq-runtime/build/test-results/test
      - store_artifacts:
          path: build/reports/jacoco/jacocoAggregate
          destination: coverage
      - store_artifacts:
          path: oq-cli/build/libs/oq.jar
          destination: oq.jar

  jazzer-fuzz:
    executor: linux-jdk21
    steps:
      - checkout
      - gradle_cache
      - run:
          name: Jazzer Coverage-Guided Fuzzing
          command: |
            mkdir -p build/fuzz-artifacts
            java -version
            set -o pipefail
            JAZZER_FUZZ=1 ./gradlew --no-daemon fuzzTest 2>&1 | tee build/fuzz-artifacts/jazzer.log
      - run:
          name: Record fuzzing metadata
          when: always
          command: |
            mkdir -p build/fuzz-artifacts
            {
              echo "commit: $CIRCLE_SHA1"
              echo "branch: $CIRCLE_BRANCH"
              echo "java: $(java -version 2>&1 | head -1)"
              echo "jazzer: 0.30.0"
              echo "targets: LexerText ParserText ParserNesting Pipeline"
              echo "profile: $([ "$CIRCLE_BRANCH" = "main" ] && echo extended || echo pull-request)"
            } > build/fuzz-artifacts/metadata.txt
            cat build/fuzz-artifacts/metadata.txt
      - run:
          name: Preserve regressions and corpus
          when: always
          command: |
            mkdir -p build/fuzz-artifacts/regressions
            # Jazzer writes crashing inputs here; keep them as artifacts even on failure.
            find . -path '*/src/fuzz/resources/*' -type f 2>/dev/null | head -50 > build/fuzz-artifacts/regressions/list.txt || true
            cp -R oq-core/src/fuzz/resources/* build/fuzz-artifacts/regressions/ 2>/dev/null || true
            cp -R oq-compiler/src/fuzz/resources/* build/fuzz-artifacts/regressions/ 2>/dev/null || true
      - store_artifacts:
          path: build/fuzz-artifacts
          destination: jazzer

workflows:
  fuzzing:
    jobs:
      - jazzer-fuzz
  macos:
    jobs:
      - test-macos:
          name: macOS / JDK 21
          java-version: "21"
      - test-macos:
          name: macOS / JDK 25
          java-version: "25"
